[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-lab"
version = "0.3.0"
description = "Evidence, permission, provenance, and capacity for autonomous laboratory workflows"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "di-omics" }]
license = { file = "LICENSE" }
keywords = [
  "autonomous-lab",
  "lab-automation",
  "pylabrobot",
  "scientific-agents",
  "provenance",
  "quality-control",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# plr-re is the only dependency: this package derives its instrument registry from
# plr_re.protocolmap.SEEDS and calls plr-re's zero-decode readers. It is not on PyPI, so
# it installs from git. Everything else is stdlib, so the ledger computes on a laptop.
dependencies = [
  "plr-re @ git+https://github.com/di-omics/plr-reverse-engineer",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.20"]

[project.scripts]
autonomous-lab = "autonomous_lab.cli:main"

[tool.setuptools.packages.find]
include = ["autonomous_lab*"]
