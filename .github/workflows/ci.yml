name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The federated claims are about a repo this one does not control, and the instrument
  # registry is derived from another. Both can drift without a commit here, so check on a
  # schedule too rather than only when someone touches this code.
  schedule:
    - cron: "0 14 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is plr-re's floor (requires-python = ">=3.9"); pin the top end too so a new
        # release cannot break the build without a commit here.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Installs plr-re from git, which is the dependency the README tells users to
        # expect. If that URL ever stops resolving, this is where it surfaces.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: The CLI runs on a bare install
        # The ledger is stdlib plus plr-re and touches no hardware, so it must compute in
        # CI exactly as it does on a laptop. A non-zero exit is correct here: the protocol
        # cannot run unattended, and `ledger` says so by exiting non-zero.
        run: |
          autonomous-lab stock
          autonomous-lab protocols
          autonomous-lab ledger single_cell_genomics || [ $? -eq 1 ]
          autonomous-lab gaps || [ $? -eq 1 ]
          autonomous-lab knowledge
          # Exits 0 and is asserted as such: the manifest ships in this repo, so the
          # federated status claims are checkable here with no checkout. What this run
          # catches is registry.py drifting from the committed manifest. It cannot catch
          # the manifest drifting from the instrument: refreshing the copy is a manual
          # step, and no runner can see the tree it came from.
          autonomous-lab doctor
          # Each of these exits 1 because the lab cannot yet do the thing it reports on.
          # That is the correct exit code and it is asserted rather than tolerated: if one
          # of them ever exits 0, either the lab genuinely improved or a report started
          # flattering it, and both are worth a failed build until someone looks.
          autonomous-lab qc single_cell_genomics || [ $? -eq 1 ]
          autonomous-lab failures single_cell_genomics || [ $? -eq 1 ]
          autonomous-lab vision || [ $? -eq 1 ]
          autonomous-lab throughput single_cell_genomics || [ $? -eq 1 ]
          autonomous-lab provenance single_cell_genomics || [ $? -eq 1 ]
          autonomous-lab loop single_cell_genomics || [ $? -eq 1 ]

  wheel:
    # `doctor` with no flag reads a manifest that is not inside the package directory, so it
    # only survives a wheel because of the data-files entry in pyproject.toml. Every other job
    # installs editable, where the repo-root copy is found and that entry is never exercised.
    # Deleting it would break `doctor` for everyone who pip-installs and nothing else would
    # notice, so build the wheel, install it somewhere clean, and run from outside the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: doctor runs from an installed wheel, outside the checkout
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheelenv/bin/autonomous-lab doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20
      - run: ruff check autonomous_lab tests

  ascii:
    # House rule: strict ASCII. Enforced rather than remembered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No non-ASCII bytes in tracked text
        run: |
          if LC_ALL=C grep -rlnP '[\x80-\xFF]' --include='*.py' --include='*.md' --include='*.toml' --include='*.json' .; then
            echo "non-ASCII bytes found in the files above"
            exit 1
          fi
          echo "ascii clean"
